<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solid Words</title>
  <link rel="icon" href="images/icon.png">
  <link rel="apple-touch-icon" href="images/icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary: #2196F3;
      --primary-dark: #1976D2;
      --success: #4CAF50;
      --warning: #FF9800;
      --danger: #f44336;
      --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #333;
      --text-light: #666;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header p {
      opacity: 0.9;
      margin-top: 5px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 30px;
      margin-bottom: 20px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--primary);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-light);
      text-transform: uppercase;
    }

    .percent {
      font-size: 1.2rem;
      font-weight: 600;
      transition: color 0.3s;
    }

    .word-display {
      text-align: center;
      padding: 30px 0;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .word-primary {
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.2s;
      user-select: none;
    }

    .word-primary:hover {
      transform: scale(1.02);
    }

    .word-secondary {
      font-size: 1.8rem;
      color: var(--text-light);
      margin-top: 15px;
      opacity: 0;
      transition: opacity 0.3s;
      cursor: pointer;
    }

    .word-secondary.visible {
      opacity: 1;
    }

    .word-number {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-top: 10px;
    }

    .word-number a {
      color: var(--primary);
      text-decoration: none;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 15px 10px;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-count {
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .btn-again {
      background: var(--danger);
      color: white;
    }

    .btn-good {
      background: var(--warning);
      color: white;
    }

    .btn-easy {
      background: var(--success);
      color: white;
    }

    .settings {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .setting-btn {
      background: transparent;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px 15px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .setting-btn:hover {
      background: #f5f5f5;
    }

    .setting-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .range-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .range-input {
      width: 70px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
    }

    .range-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .range-label {
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .shortcuts {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-light);
      margin-top: 15px;
      opacity: 0.7;
    }

    .progress-bar {
      display: flex;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      background: #eee;
      margin-top: 10px;
    }

    .progress-segment {
      transition: width 0.3s;
    }

    .progress-easy { background: var(--success); }
    .progress-good { background: var(--warning); }
    .progress-again { background: var(--danger); }

    .loading {
      text-align: center;
      padding: 50px;
      color: white;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .toast.visible {
      opacity: 1;
    }

    .reset-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      color: var(--text-light);
    }

    .reset-btn:hover {
      color: var(--danger);
    }

    @media (max-width: 400px) {
      .word-primary { font-size: 2rem; }
      .word-secondary { font-size: 1.5rem; }
      .btn { padding: 12px 8px; font-size: 0.9rem; }
    }

    .solid-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .solid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .solid-user {
      font-size: 0.85rem;
      color: var(--text-light);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }

    .solid-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .solid-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .solid-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .solid-btn-primary {
      background: var(--primary);
      color: white;
    }

    .solid-btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .solid-btn-secondary {
      background: #e0e0e0;
      color: var(--text);
    }

    .solid-btn-secondary:hover:not(:disabled) {
      background: #d0d0d0;
    }

    .solid-btn-logout {
      background: transparent;
      color: var(--text-light);
      padding: 8px;
    }

    .solid-btn-logout:hover {
      color: var(--danger);
    }

    .solid-status {
      font-size: 0.8rem;
      color: var(--text-light);
      text-align: center;
      padding: 5px;
    }

    .solid-status.success {
      color: var(--success);
    }

    .solid-status.error {
      color: var(--danger);
    }

    .login-form {
      display: flex;
      gap: 8px;
    }

    .login-form input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .login-form input:focus {
      outline: none;
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect, useCallback } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';
    import {
      login,
      logout,
      handleIncomingRedirect,
      getDefaultSession,
      fetch as solidFetch
    } from 'https://esm.sh/@inrupt/solid-client-authn-browser@2.2.4';
    import { SolidLocalStorage } from './lib/solid-localstorage.js';

    const html = htm.bind(h);

    // Parse TTL format: <#1> <...#label> "word"@lang .
    function parseTTL(text) {
      const words = {};
      const lines = text.split('\n');
      const regex = /<#(\d+)>\s+<[^>]+>\s+"([^"]+)"@(\w+)/;

      for (const line of lines) {
        const match = line.match(regex);
        if (match) {
          const [, id, word, lang] = match;
          if (!words[id]) words[id] = {};
          words[id][lang] = word;
        }
      }
      return words;
    }

    // Storage helpers
    const storage = {
      get: (key, def = null) => {
        try {
          const val = localStorage.getItem(key);
          return val ? JSON.parse(val) : def;
        } catch { return def; }
      },
      set: (key, val) => localStorage.setItem(key, JSON.stringify(val))
    };

    function App() {
      const [words, setWords] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [toast, setToast] = useState('');

      // Settings
      const [lang1, setLang1] = useState('cs');
      const [lang2, setLang2] = useState('en');
      const [minWords, setMinWords] = useState(() => storage.get('minWords', 1));
      const [maxWords, setMaxWords] = useState(() => storage.get('maxWords', 100));
      const [reversed, setReversed] = useState(() => storage.get('reversed', false));

      // Current word state
      const [currentNum, setCurrentNum] = useState(1);
      const [showTranslation, setShowTranslation] = useState(false);

      // Progress tracking (persisted)
      const [again, setAgain] = useState(() => storage.get('again', []));
      const [good, setGood] = useState(() => storage.get('good', []));
      const [easy, setEasy] = useState(() => storage.get('easy', []));

      // Session tracking (not persisted - resets on reload)
      const [sessionDiscarded, setSessionDiscarded] = useState(new Set()); // Easy words this session
      const [sessionAgain, setSessionAgain] = useState(new Set());         // Again words this session
      const [sessionGood, setSessionGood] = useState(new Set());           // Good words this session
      const [sessionPoints, setSessionPoints] = useState(0);
      const [sessionCorrect, setSessionCorrect] = useState(0);

      // Solid sync state
      const [solidSession, setSolidSession] = useState(null);
      const [solidStatus, setSolidStatus] = useState('');
      const [solidStatusType, setSolidStatusType] = useState(''); // 'success' | 'error' | ''
      const [oidcIssuer, setOidcIssuer] = useState(() => storage.get('oidcIssuer', 'https://solidcommunity.net'));
      const [syncing, setSyncing] = useState(false);

      const percent = sessionPoints > 0 ? Math.round((sessionCorrect / sessionPoints) * 100) : 0;
      const rangeSize = maxWords - minWords + 1;

      const notify = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 2000);
      }, []);

      // Handle Solid login redirect
      useEffect(() => {
        handleIncomingRedirect({ restorePreviousSession: true }).then((info) => {
          if (info?.isLoggedIn) {
            setSolidSession(getDefaultSession());
            setSolidStatus('Logged in');
            setSolidStatusType('success');
          }
        });
      }, []);

      // Get pod URL from WebID
      const getPodUrl = useCallback(async (webId) => {
        // Simple heuristic: WebID is usually at pod/profile/card#me
        // So pod URL is everything before /profile/
        const match = webId.match(/^(https?:\/\/[^/]+\/[^/]+)/);
        return match ? match[1] : webId.replace(/\/profile\/card#me$/, '');
      }, []);

      // Solid login
      const handleSolidLogin = useCallback(async () => {
        storage.set('oidcIssuer', oidcIssuer);
        try {
          await login({
            oidcIssuer,
            redirectUrl: window.location.href,
            clientName: 'Solid Words'
          });
        } catch (err) {
          setSolidStatus(`Login failed: ${err.message}`);
          setSolidStatusType('error');
        }
      }, [oidcIssuer]);

      // Solid logout
      const handleSolidLogout = useCallback(async () => {
        await logout();
        setSolidSession(null);
        setSolidStatus('');
        setSolidStatusType('');
      }, []);

      // Save to Solid
      const handleSolidSave = useCallback(async () => {
        if (!solidSession?.info?.webId) return;
        setSyncing(true);
        setSolidStatus('Saving...');
        setSolidStatusType('');

        try {
          const podUrl = await getPodUrl(solidSession.info.webId);
          const sync = new SolidLocalStorage({
            session: solidSession,
            podUrl,
            filter: (key) => ['again', 'good', 'easy', 'minWords', 'maxWords', 'reversed'].includes(key)
          });
          const result = await sync.save();
          setSolidStatus(`Saved ${result.keys} keys to pod`);
          setSolidStatusType('success');
        } catch (err) {
          setSolidStatus(`Save failed: ${err.message}`);
          setSolidStatusType('error');
        } finally {
          setSyncing(false);
        }
      }, [solidSession, getPodUrl]);

      // Restore from Solid
      const handleSolidRestore = useCallback(async () => {
        if (!solidSession?.info?.webId) return;
        setSyncing(true);
        setSolidStatus('Restoring...');
        setSolidStatusType('');

        try {
          const podUrl = await getPodUrl(solidSession.info.webId);
          const sync = new SolidLocalStorage({
            session: solidSession,
            podUrl,
            onConflict: 'remote-wins',
            filter: (key) => ['again', 'good', 'easy', 'minWords', 'maxWords', 'reversed'].includes(key)
          });
          const result = await sync.restore();

          if (result.notFound) {
            setSolidStatus('No saved data found on pod');
            setSolidStatusType('');
          } else {
            // Reload state from localStorage
            setAgain(storage.get('again', []));
            setGood(storage.get('good', []));
            setEasy(storage.get('easy', []));
            setMinWords(storage.get('minWords', 1));
            setMaxWords(storage.get('maxWords', 100));
            setReversed(storage.get('reversed', false));
            // Reset session
            setSessionDiscarded(new Set());
            setSessionAgain(new Set());
            setSessionGood(new Set());
            setSessionPoints(0);
            setSessionCorrect(0);

            setSolidStatus(`Restored ${result.keys} keys from pod`);
            setSolidStatusType('success');
          }
        } catch (err) {
          setSolidStatus(`Restore failed: ${err.message}`);
          setSolidStatusType('error');
        } finally {
          setSyncing(false);
        }
      }, [solidSession, getPodUrl]);

      // Load words
      useEffect(() => {
        const url = 'data/czech-en.ttl';  // Local cleaned word list (spoken frequency)
        const cacheKey = `words-${lang1}-${lang2}-v4`;

        const cached = storage.get(cacheKey);
        if (cached) {
          setWords(cached);
          setLoading(false);
          pickNext(cached);
          return;
        }

        fetch(url)
          .then(r => r.text())
          .then(text => {
            const parsed = parseTTL(text);
            storage.set(cacheKey, parsed);
            setWords(parsed);
            setLoading(false);
            pickNext(parsed);
            notify('Words loaded!');
          })
          .catch(err => {
            setError(err.message);
            setLoading(false);
          });
      }, [lang1, lang2]);

      // Weighted selection algorithm
      const pickNext = useCallback((wordList = words) => {
        if (!wordList) return;

        // Build weighted pool of candidates
        const candidates = [];

        for (let num = minWords; num <= maxWords; num++) {
          // Skip if discarded this session (marked easy)
          if (sessionDiscarded.has(num)) continue;

          // Weight: again=1.0, good=0.5, new=1.0
          let weight = 1.0;
          if (sessionAgain.has(num)) {
            weight = 1.0;  // High priority - needs work
          } else if (sessionGood.has(num)) {
            weight = 0.5;  // Lower priority - sort of knows it
          }
          // New words get weight 1.0 (default)

          candidates.push({ num, weight });
        }

        if (candidates.length === 0) {
          // All words in range discarded! Session complete
          notify(`Session complete! ${sessionDiscarded.size} words mastered`);
          return;
        }

        // Weighted random selection
        const totalWeight = candidates.reduce((sum, c) => sum + c.weight, 0);
        let random = Math.random() * totalWeight;

        for (const candidate of candidates) {
          random -= candidate.weight;
          if (random <= 0) {
            setCurrentNum(candidate.num);
            setShowTranslation(false);
            return;
          }
        }

        // Fallback
        setCurrentNum(candidates[0].num);
        setShowTranslation(false);
      }, [words, minWords, maxWords, sessionDiscarded, sessionAgain, sessionGood, notify]);

      const handleResponse = useCallback((type) => {
        const updateList = (list, setList, key) => {
          if (!list.includes(currentNum)) {
            const newList = [...list, currentNum];
            setList(newList);
            storage.set(key, newList);
          }
        };

        setSessionPoints(p => p + 1);

        if (type === 'again') {
          updateList(again, setAgain, 'again');
          // Add to session again pool (will see it again with high weight)
          setSessionAgain(prev => new Set([...prev, currentNum]));
          setSessionGood(prev => { const s = new Set(prev); s.delete(currentNum); return s; });
        } else if (type === 'good') {
          updateList(good, setGood, 'good');
          // Add to session good pool (will see it again with lower weight)
          setSessionGood(prev => new Set([...prev, currentNum]));
          setSessionAgain(prev => { const s = new Set(prev); s.delete(currentNum); return s; });
        } else if (type === 'easy') {
          updateList(easy, setEasy, 'easy');
          setSessionCorrect(c => c + 1);
          // Discard from session - won't see it again until session reset
          setSessionDiscarded(prev => new Set([...prev, currentNum]));
          setSessionAgain(prev => { const s = new Set(prev); s.delete(currentNum); return s; });
          setSessionGood(prev => { const s = new Set(prev); s.delete(currentNum); return s; });
          if (navigator.vibrate) navigator.vibrate(50);
        }

        pickNext();
      }, [currentNum, again, good, easy, pickNext]);

      // Range change handlers
      const handleMinChange = useCallback((e) => {
        const val = Math.max(1, Math.min(parseInt(e.target.value) || 1, maxWords - 1));
        setMinWords(val);
        storage.set('minWords', val);
        // Reset session when range changes
        setSessionDiscarded(new Set());
        setSessionAgain(new Set());
        setSessionGood(new Set());
      }, [maxWords]);

      const handleMaxChange = useCallback((e) => {
        const val = Math.max(minWords + 1, Math.min(parseInt(e.target.value) || 100, 6808));
        setMaxWords(val);
        storage.set('maxWords', val);
        // Reset session when range changes
        setSessionDiscarded(new Set());
        setSessionAgain(new Set());
        setSessionGood(new Set());
      }, [minWords]);

      const resetSession = useCallback(() => {
        setSessionDiscarded(new Set());
        setSessionAgain(new Set());
        setSessionGood(new Set());
        setSessionPoints(0);
        setSessionCorrect(0);
        notify('Session reset - all words back in deck');
        pickNext();
      }, [notify, pickNext]);

      const resetAllProgress = useCallback(() => {
        if (confirm('Reset ALL progress (including lifetime stats)?')) {
          setAgain([]);
          setGood([]);
          setEasy([]);
          setSessionDiscarded(new Set());
          setSessionAgain(new Set());
          setSessionGood(new Set());
          setSessionPoints(0);
          setSessionCorrect(0);
          storage.set('again', []);
          storage.set('good', []);
          storage.set('easy', []);
          notify('All progress reset');
        }
      }, [notify]);

      const toggleReversed = useCallback(() => {
        const newVal = !reversed;
        setReversed(newVal);
        storage.set('reversed', newVal);
        notify(newVal ? 'English → Czech' : 'Czech → English');
      }, [reversed, notify]);

      // Keyboard shortcuts
      useEffect(() => {
        const handleKey = (e) => {
          if (e.target.tagName === 'INPUT') return;

          switch(e.key) {
            case '1': case 'a': case 'A':
              handleResponse('again');
              break;
            case '2': case 'g': case 'G':
              handleResponse('good');
              break;
            case '3': case 'e': case 'E':
              handleResponse('easy');
              break;
            case ' ':
            case 'Enter':
            case '4':
              e.preventDefault();
              setShowTranslation(true);
              break;
            case 's': case 'S':
              pickNext();
              break;
            case 'r': case 'R':
              toggleReversed();
              break;
          }
        };

        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [handleResponse, pickNext, toggleReversed]);

      const currentWord = words?.[currentNum];

      // Determine which language to show first based on reversed setting
      const showLang = reversed ? lang2 : lang1;
      const hideLang = reversed ? lang1 : lang2;

      const translateUrl = currentWord
        ? `https://translate.google.com/#${showLang}/${hideLang}/${encodeURIComponent(currentWord[showLang] || '')}`
        : '#';

      if (loading) {
        return html`
          <div class="container">
            <div class="loading">
              <div class="loading-spinner"></div>
              <p>Loading vocabulary...</p>
            </div>
          </div>
        `;
      }

      if (error) {
        return html`
          <div class="container">
            <div class="card">
              <h2>Error loading words</h2>
              <p>${error}</p>
            </div>
          </div>
        `;
      }

      return html`
        <div class="container">
          <div class="header">
            <h1>Solid Words</h1>
            <p>Your personal vocabulary trainer</p>
          </div>

          <div class="card">
            <div class="stats">
              <div class="stat">
                <div class="stat-value">${sessionDiscarded.size}/${rangeSize}</div>
                <div class="stat-label">Deck</div>
              </div>
              <div class="stat">
                <span class="percent" style="color: hsl(${percent * 1.2}, 70%, 45%)">${percent}%</span>
                <div class="stat-label">Correct</div>
              </div>
              <div class="stat">
                <button class="reset-btn" onclick=${resetAllProgress} title="Reset all progress">
                  <div class="stat-value">${easy.length}</div>
                </button>
                <div class="stat-label">Lifetime</div>
              </div>
            </div>
            <div class="progress-bar">
              <div class="progress-segment progress-easy" style="width: ${(sessionDiscarded.size / rangeSize) * 100}%"></div>
              <div class="progress-segment progress-good" style="width: ${(sessionGood.size / rangeSize) * 100}%"></div>
              <div class="progress-segment progress-again" style="width: ${(sessionAgain.size / rangeSize) * 100}%"></div>
            </div>

            <div class="word-display" onclick=${() => setShowTranslation(true)}>
              <div class="word-primary">${currentWord?.[showLang] || '...'}</div>
              <div class="word-secondary ${showTranslation ? 'visible' : ''}">${currentWord?.[hideLang] || '...'}</div>
              <div class="word-number">
                <a href=${translateUrl} target="_blank">#${currentNum}</a> of ${maxWords}
                ${reversed ? ' (EN→CS)' : ' (CS→EN)'}
              </div>
            </div>

            <div class="buttons">
              <button class="btn btn-again" onclick=${() => handleResponse('again')}>
                Again
                <span class="btn-count">${again.length}</span>
              </button>
              <button class="btn btn-good" onclick=${() => handleResponse('good')}>
                Good
                <span class="btn-count">${good.length}</span>
              </button>
              <button class="btn btn-easy" onclick=${() => handleResponse('easy')}>
                Easy
                <span class="btn-count">${easy.length}</span>
              </button>
            </div>
            <div class="shortcuts">Keys: 1/A 2/G 3/E · 4/Enter/Space=reveal · S=skip · R=reverse</div>
          </div>

          <div class="card settings">
            <div class="range-selector">
              <span class="range-label">Words</span>
              <input type="number" class="range-input" value=${minWords} onchange=${handleMinChange} min="1" max=${maxWords - 1} />
              <span class="range-label">to</span>
              <input type="number" class="range-input" value=${maxWords} onchange=${handleMaxChange} min=${minWords + 1} max="6808" />
            </div>
            <button class="setting-btn ${reversed ? 'active' : ''}" onclick=${toggleReversed}>
              ${reversed ? 'EN → CS' : 'CS → EN'}
            </button>
            <button class="setting-btn" onclick=${resetSession}>
              New Session
            </button>
          </div>

          <div class="card solid-card">
            ${solidSession?.info?.isLoggedIn ? html`
              <div class="solid-header">
                <span class="solid-user" title=${solidSession.info.webId}>
                  ${solidSession.info.webId.split('/').pop().replace('#me', '')}
                </span>
                <button class="solid-btn solid-btn-logout" onclick=${handleSolidLogout} title="Logout">
                  ✕
                </button>
              </div>
              <div class="solid-actions">
                <button class="solid-btn solid-btn-primary" onclick=${handleSolidSave} disabled=${syncing}>
                  ${syncing ? '...' : '↑'} Save to Pod
                </button>
                <button class="solid-btn solid-btn-secondary" onclick=${handleSolidRestore} disabled=${syncing}>
                  ${syncing ? '...' : '↓'} Restore from Pod
                </button>
              </div>
              ${solidStatus && html`<div class="solid-status ${solidStatusType}">${solidStatus}</div>`}
            ` : html`
              <div class="login-form">
                <input
                  type="text"
                  placeholder="Solid provider URL"
                  value=${oidcIssuer}
                  onchange=${(e) => setOidcIssuer(e.target.value)}
                />
                <button class="solid-btn solid-btn-primary" onclick=${handleSolidLogin}>
                  Login
                </button>
              </div>
              ${solidStatus && html`<div class="solid-status ${solidStatusType}">${solidStatus}</div>`}
            `}
          </div>

          <div class="toast ${toast ? 'visible' : ''}">${toast}</div>
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
